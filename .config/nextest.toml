# Warns every `period`; kills after `terminate-after` periods.
# e.g. period = "60s", terminate-after = 3 => kills after 3*60s = 180s.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# Ignored scale tests need a longer timeout than ordinary integration tests.
[profile.fallback-scale]
slow-timeout = { period = "60s", terminate-after = 60 }

# Other scale tests retain their existing runner limit.
[[profile.fallback-scale.overrides]]
filter = 'not test(=expiry_oversize::expiry_bounded_round_inventory_splits_and_pays_every_owner)'
slow-timeout = { period = "60s", terminate-after = 29 }

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci-merge-train]
slow-timeout = { period = "60s", terminate-after = 5 }
retries = 3
