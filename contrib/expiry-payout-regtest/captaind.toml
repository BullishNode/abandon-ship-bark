# captaind config for the regtest stack (test-only values).
data_dir = "__FIXTURE__/captaind"
network = "regtest"
vtxo_lifetime = 64
min_board_amount = "20000 sat"
vtxo_exit_delta = 12
max_vtxo_exit_depth = 100
max_arkoor_fanout = 4
required_board_confirmations = 3
min_trusted_confs = 2
rpc_rich_errors = true
sync_manager_block_poll_interval = "100ms"
nursery_confirm_target_blocks = 6
otel_deployment_name = "my_regtest"
max_read_mailbox_items = 100
round_interval = "5s"
round_submit_time = "5s"
round_sign_time = "5s"
nb_round_nonces = 8
round_forfeit_nonces_timeout = "30s"
offboard_session_timeout = "30s"
offboard_check_interval = "1s"
offboard_acceptable_fee_rate_duration = "15m"
cln_reconnect_interval = "10s"
invoice_check_interval = "3s"
cln_xpay_timeout = "60s"
invoice_check_base_delay = "10s"
max_invoice_check_delay = "10m"
invoice_poll_interval = "30s"
htlc_settlement_poll_interval = "60s"
track_all_base_delay = "1s"
max_track_all_delay = "60s"
htlc_expiry_delta = 40
htlc_send_expiry_delta = 258
max_user_invoice_cltv_delta = 250
invoice_expiry = "48h"
receive_htlc_forward_timeout = "3min"
ln_receive_anti_dos_required = false
ln_max_fee_ppm = 900000

[fees.board]
min_fee_sat = 330 # Can be dust
base_fee_sat = 100
ppm = 1000 # 0.1%

[fees.offboard]
base_fee_sat = 200
fixed_additional_vb = 212
ppm_expiry_table = [
    { expiry_blocks_threshold = 0, ppm = 0 },       # exp <= 96: 0 ppm
    { expiry_blocks_threshold = 97, ppm = 1000 },   # 96 < exp <= 198: 1,000 ppm (0.1%)
    { expiry_blocks_threshold = 199, ppm = 4000 },  # 198 < exp <= 2160: 4,000 ppm (0.4%)
    { expiry_blocks_threshold = 2161, ppm = 8000 }, # 2160 < exp: 8,000 ppm (0.8%)
]

[fees.refresh]
base_fee_sat = 150
ppm_expiry_table = [
    { expiry_blocks_threshold = 0, ppm = 0 },       # exp <= 96: 0 ppm
    { expiry_blocks_threshold = 97, ppm = 1000 },   # 96 < exp <= 198: 1,000 ppm (0.1%)
    { expiry_blocks_threshold = 199, ppm = 4000 },  # 198 < exp <= 2160: 4,000 ppm (0.4%)
    { expiry_blocks_threshold = 2161, ppm = 8000 }, # 2160 < exp: 8,000 ppm (0.8%)
]

[fees.lightning_receive]
base_fee_sat = 100
ppm = 2000 # 0.2%

[fees.lightning_send]
min_fee_sat = 10
base_fee_sat = 75
ppm_expiry_table = [
    { expiry_blocks_threshold = 0, ppm = 0 },       # exp <= 96: 0 ppm
    { expiry_blocks_threshold = 97, ppm = 1000 },   # 96 < exp <= 198: 1,000 ppm (0.1%)
    { expiry_blocks_threshold = 199, ppm = 4000 },  # 198 < exp <= 2160: 4,000 ppm (0.4%)
    { expiry_blocks_threshold = 2161, ppm = 8000 }, # 2160 < exp: 8,000 ppm (0.8%)
]

[vtxopool]
vtxo_targets = []
vtxo_target_issue_threshold = 80
vtxo_lifetime = 64
vtxo_pre_expiry = 10
max_vtxo_exit_depth = 3

[fee_estimator]
update_interval = "1s"
history_duration = "60m"
fallback_fee_rate_fast = "2sat/vb"
fallback_fee_rate_regular = "1sat/vb"
fallback_fee_rate_slow = "1sat/vb"

[rpc]
public_address = "127.0.0.1:48535"
admin_address = "127.0.0.1:48536"
integration_address = "127.0.0.1:48537"

[postgres]
host = "127.0.0.1"
user = "postgres"
port = 50432
name = "expiry_task"
max_connections = 10

[bitcoind]
url = "http://127.0.0.1:53443"
rpc_user = "second"
rpc_pass = "ark"


[expiry_payout]
enabled = true
interval = "1s"
grace_blocks = 144
sweep_min_confs = 6
min_payout_sat = 1000
max_fee_pct = 20
max_batch = 100
receipt_dir = "__FIXTURE__/receipts"
watchman_config = "__FIXTURE__/watchmand.toml"
